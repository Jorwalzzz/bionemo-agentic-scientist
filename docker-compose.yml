version: '3.8'

services:
  cockpit:
    build: .
    container_name: bionemo-agentic-cockpit
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - PYTHONUNBUFFERED=1
      - PORT=8000
    command: ["python", "serve_cockpit.py"]
    restart: unless-stopped

  dashboard:
    build: .
    container_name: bionemo-agentic-dashboard
    ports:
      - "8501:8501"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - PYTHONUNBUFFERED=1
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped
