name: BioNeMo Agentic Scientist CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run Comprehensive Fuzz & Stress Validation
        run: |
          python tests/comprehensive_fuzz_loop.py

      - name: Verify CLI Campaign on KRAS G12D
        run: |
          python run_agentic_scientist.py --target "KRAS G12D" --candidates 4

      - name: Verify CLI Campaign on SARS-CoV-2 Mpro
        run: |
          python run_agentic_scientist.py --target "SARS-CoV-2 Mpro" --candidates 4

      - name: Verify CLI Campaign on HER2
        run: |
          python run_agentic_scientist.py --target "HER2" --candidates 4
