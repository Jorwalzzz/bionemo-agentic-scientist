name: Agentic BioNeMo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdkit biopython matplotlib seaborn requests pytest rich streamlit py3Dmol

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Verify CLI Execution
        run: |
          python run_agentic_scientist.py --target "KRAS G12D" --candidates 6
